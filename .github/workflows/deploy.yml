name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy application through SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0c8b815fba0c3c875 \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deployment" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/devsecops-social-app",
              "sudo -u ubuntu git -C /home/ubuntu/devsecops-social-app checkout main",
              "sudo -u ubuntu git -C /home/ubuntu/devsecops-social-app pull origin main",
              "docker compose build",
              "docker compose up -d",
              "echo Waiting for containers...",
              "sleep 10",
              "docker compose ps",
              "curl -f http://localhost:8080",
              "curl -f http://localhost:9090/-/healthy",
              "curl -f http://localhost:3000/api/health",
              "echo Deployment successful"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          echo "Waiting for SSM deployment to complete..."

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
              --instance-id i-0c8b815fba0c3c875 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Attempt $i: Status=$STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy.outputs.COMMAND_ID }}" \
                  --instance-id i-0c8b815fba0c3c875 \
                  --output json

                exit 1
                ;;
              Pending|InProgress|"")
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Deployment timed out waiting for SSM."
          exit 1

      - name: Verify deployment
        run: |
          echo "Deployment verification completed."
