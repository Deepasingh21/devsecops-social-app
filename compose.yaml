services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: devsecops-backend

    env_file:
      - ./backend/.env.docker

    expose:
      - "5000"

    networks:
      - devsecops-network

    volumes:
      - devsecops-uploads:/app/uploads

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: devsecops-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - devsecops-network

    restart: unless-stopped


networks:
  devsecops-network:
    external: true


volumes:
  devsecops-uploads:
    external: true
